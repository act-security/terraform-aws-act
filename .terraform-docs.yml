formatter: markdown table

header-from: .header.md

recursive:
  enabled: true
  path: modules
  include-main: true

output:
  file: README.md
  mode: replace
  template: |-
    {{ .Content }}

sort:
  enabled: true
  by: required

settings:
  anchor: false
  hide-empty: true
  html: false
  lockfile: false
